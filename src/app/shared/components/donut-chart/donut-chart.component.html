<div class="donut">
  <svg class="donut__svg" viewBox="0 0 36 36" role="img" [attr.aria-label]="label">
    <circle class="donut__ring" cx="18" cy="18" [attr.r]="radius" fill="none" stroke-width="4"></circle>
    @for (s of slices(); track s.label) {
      <circle cx="18" cy="18" [attr.r]="radius" fill="none" stroke-width="4" [attr.stroke]="s.color"
        [attr.stroke-dasharray]="s.pct + ' ' + (100 - s.pct)" [attr.stroke-dashoffset]="25 - s.offset"></circle>
    }
    <text x="18" y="18.5" text-anchor="middle" class="donut__total">{{ total() }}</text>
    <text x="18" y="23" text-anchor="middle" class="donut__caption">{{ centerLabel }}</text>
  </svg>

  <ul class="donut__legend">
    @for (s of slices(); track s.label) {
      <li><span class="donut__dot" [style.background]="s.color"></span>{{ s.label }} <b>{{ s.value }}</b></li>
    }
  </ul>
</div>
