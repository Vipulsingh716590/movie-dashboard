<div class="backdrop" (click)="cancel.emit()"></div>
<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
  <h2 id="confirm-title">{{ title }}</h2>
  <p id="confirm-message">{{ message }}</p>
  <div class="actions">
    <button type="button" class="btn" (click)="cancel.emit()">Cancel</button>
    <button type="button" class="btn btn--danger-solid" (click)="confirm.emit()">{{ confirmLabel }}</button>
  </div>
</div>
