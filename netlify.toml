# Netlify detects Angular and adds its Angular plugin, which needs Node 22+ (hence NODE_VERSION) and publishes
# dist/movie-dashboard/browser, where the demo bundler writes the page.
# Hosted demo: no API needed, sample data runs in the browser. Netlify -> Add new site -> Import from Git -> this repo.
# This publishes the demo build, not the real dashboard, because the real one edits the API and has no login yet.
[build]
  command = "npm run build:demo"
  publish = "dist/movie-dashboard/browser"

[build.environment]
  NODE_VERSION = "22"

# TMDB through this site: the browser calls /tmdb-api/... and /tmdb-img/..., Netlify fetches TMDB server-side.
# Some Indian networks (Jio, for one) block api.themoviedb.org and image.tmdb.org, so direct calls fail there.
# Query strings (api_key, page, ...) are passed on to TMDB unchanged.
[[redirects]]
  from = "/tmdb-api/*"
  to = "https://api.themoviedb.org/3/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tmdb-img/*"
  to = "https://image.tmdb.org/t/p/:splat"
  status = 200
  force = true
